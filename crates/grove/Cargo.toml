[package]
name = "grove"
version = "0.1.0"
description = "A repository-scoped git worktree manager using bare repos"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "grove"
path = "src/lib.rs"

[[bin]]
name = "grove"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
console = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
