[package]
name = "forest"
version = "0.11.1"
description = "A CLI tool to make working with git worktrees easier by establishing a few conventions and abstracting away some git commands."
homepage = "https://github.com/tcione/forest"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
grove = { path = "../grove" }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = "6"
console = "0.16.1"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }

[dev-dependencies]
tempfile = { workspace = true }
